name: one-shot verified branch cleanup 2026-10-06

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fail closed unless only this workflow changed since cleanup merge
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b47343a652dc6502f906d0b5f94199de732ca432 HEAD
          changed="$(git diff --name-only b47343a652dc6502f906d0b5f94199de732ca432..HEAD)"
          test "$changed" = ".github/workflows/one-shot-branch-cleanup-main-20261006.yml"

      - name: Delete final temporary cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/ops/run-branch-cleanup-20261006"
