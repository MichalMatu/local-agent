name: one-shot merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Delete exact merged branches
        shell: bash
        run: |
          set -euo pipefail

          check_branch() {
            local branch="$1"
            local expected="$2"
            local actual
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ -z "$actual" ]]; then
              echo "branch already absent: $branch"
              return 0
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "ref mismatch for $branch: expected $expected, got $actual" >&2
              return 1
            fi
          }

          check_branch "chore/add-wolf-ue5-target" "b143008834223231414068b029122a760f3aedc4"
          check_branch "fix/fabric-control-repair-hints-20261006" "c7ee3a2813d328f8e919f32d9fa4bf351d059f68"
          check_branch "fix/conversation-fabric-submit-loop" "cc0157908f387326a37e04dda761fdfe138dc430"

          git push origin --delete \
            chore/add-wolf-ue5-target \
            fix/fabric-control-repair-hints-20261006 \
            fix/conversation-fabric-submit-loop
