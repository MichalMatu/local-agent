name: one-shot delete sequential test branch 2026-10-06

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the verified abandoned test branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="test/sequential-fabric-cycles-20261006"
          expected="20557bd3a111a2f56942528fa1c023cd5dd5a5be"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$actual" = "$expected"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=MichalMatu:${branch}&per_page=1" --jq 'length')" = "0"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
