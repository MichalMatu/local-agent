name: one-shot Host Ops absorption branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-host-ops-absorption-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Delete exact merged absorption branch
        shell: bash
        run: |
          set -euo pipefail
          branch="feat/absorb-host-ops-runtime"
          expected="12329f2023352d2a01842f6ff3453dc8debc0791"
          actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -z "$actual" ]]; then
            echo "branch already absent: $branch"
            exit 0
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "ref mismatch for $branch: expected $expected, got $actual" >&2
            exit 1
          fi
          git push origin --delete "$branch"
