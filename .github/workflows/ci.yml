name: local-agent CI

on:
  push:
    branches:
      - main
      - 'v*-staging'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile agentd.py agent_core.py agent_runtime.py agentctl.py
      - name: Unit tests
        run: python -m unittest discover -q
