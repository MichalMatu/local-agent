name: local-agent CI

on:
  push:
    branches:
      - main
      - 'v*-staging'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tooling
        run: python -m pip install --disable-pip-version-check ruff==0.12.11
      - name: Compile
        run: python -m py_compile agentd.py agent_core.py agent_runtime.py agent_process.py agent_repository.py agentctl.py
      - name: Lint
        run: ruff check agentd.py agent_core.py agent_runtime.py agent_process.py agent_repository.py agentctl.py tests
      - name: Unit tests
        run: python -m unittest discover -q
