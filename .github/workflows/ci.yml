name: local-agent CI

on:
  push:
    branches:
      - main
      - 'v*-staging'
      - 'work/**'
  pull_request:

permissions:
  contents: read

jobs:
  bridge-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Real extension delivery and restart smoke
        run: python scripts/verify.py --profile bridge-browser

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lint tooling
        run: python -m pip install --disable-pip-version-check ruff==0.12.11
      - name: Compile
        run: python scripts/verify.py --only compile
      - name: Lint
        run: python scripts/verify.py --only lint
      - name: Validate chat bridge
        run: python scripts/verify.py --only bridge
      - name: Unit and integration tests
        run: python scripts/verify.py --only tests

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install coverage tooling
        run: python -m pip install --disable-pip-version-check coverage==7.16.0
      - name: Measure unit and integration coverage
        run: |
          coverage run -m unittest discover -q
          coverage report -m
          coverage xml

  python-314:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Python 3.14 compatibility suite
        run: python scripts/verify.py --only tests

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Process, checkpoint, multi-repository, binding, and emergency-control smoke tests
        run: python scripts/verify.py --profile macos-smoke
