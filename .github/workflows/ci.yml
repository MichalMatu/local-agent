name: local-agent CI

on:
  push:
    branches:
      - main
      - 'v*-staging'
      - 'work/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lint tooling
        run: python -m pip install --disable-pip-version-check ruff==0.12.11
      - name: Compile
        run: python scripts/verify.py --only compile
      - name: Lint
        run: python scripts/verify.py --only lint
      - name: Validate chat bridge
        run: python scripts/verify.py --only bridge
      - name: Unit and integration tests
        run: python scripts/verify.py --only tests

  python-314:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Python 3.14 compatibility suite
        run: python scripts/verify.py --only tests

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Process, checkpoint, multi-repository, binding, and emergency-control smoke tests
        run: python scripts/verify.py --profile macos-smoke
