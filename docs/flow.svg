<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">local-agent workflow</title>
<desc id="desc">An LLM plans an explicit task, a transport delivers it to local-agent, local tools execute it, and structured results return to the planner.</desc>
<rect width="1600" height="620" rx="24" fill="#0b0f14"/>
<text x="60" y="76" fill="#f4f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="700">local-agent</text>
<text x="60" y="118" fill="#aab7c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">The planner decides. The runner executes. Real output is the source of truth.</text>
<line x1="268" y1="265" x2="266" y2="265" stroke="#8fa1b3" stroke-width="5" stroke-linecap="round"/>
<polygon points="266,256 280,265 266,274" fill="#8fa1b3"/>
