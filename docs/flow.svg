<text x="1427.5" y="317" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">+ exit codes</text>
<path d="M1427 365 V438 H158 V365" fill="none" stroke="#4da3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="148,380 158,360 168,380" fill="#4da3ff"/>
<text x="800" y="470" text-anchor="middle" fill="#75b8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">feedback loop: inspect result -&gt; plan the next deterministic task</text>
<rect x="60" y="515" width="1480" height="70" rx="16" fill="#111821" stroke="#263442" stroke-width="2"/>
<text x="800" y="559" text-anchor="middle" fill="#d8e2ec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">AI-friendly, not AI-dependent  •  explicit  •  auditable  •  reproducible  •  local execution</text>
<text x="800" y="604" text-anchor="middle" fill="#8191a2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Current transport: Git. The architecture can support other transports such as HTTP/API, MCP, or queues.</text>
</svg>