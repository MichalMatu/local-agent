<polygon points="1286,256 1300,265 1286,274" fill="#8fa1b3"/>
<rect x="55" y="190" width="205" height="150" rx="20" fill="#16202a" stroke="#4da3ff" stroke-width="3"/>
<text x="157.5" y="248" text-anchor="middle" fill="#f7fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">ChatGPT / LLM</text>
<text x="157.5" y="290" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">plans the change</text>
<rect x="290" y="190" width="205" height="150" rx="20" fill="#16202a" stroke="#8798aa" stroke-width="3"/>
<text x="392.5" y="248" text-anchor="middle" fill="#f7fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Task JSON</text>
<text x="392.5" y="290" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">explicit edits</text>
<text x="392.5" y="317" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">+ commands</text>
<rect x="525" y="190" width="225" height="150" rx="20" fill="#16202a" stroke="#b08cff" stroke-width="3"/>
<text x="637.5" y="248" text-anchor="middle" fill="#f7fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Transport</text>
<text x="637.5" y="290" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Git control branch</text>
<text x="637.5" y="317" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">today</text>
<rect x="780" y="190" width="245" height="150" rx="20" fill="#16202a" stroke="#63d18b" stroke-width="3"/>
<text x="902.5" y="248" text-anchor="middle" fill="#f7fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">local-agent</text>
<text x="902.5" y="290" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">executes exactly</text>
<rect x="1055" y="190" width="225" height="150" rx="20" fill="#16202a" stroke="#8798aa" stroke-width="3"/>
<text x="1167.5" y="248" text-anchor="middle" fill="#f7fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Local tools</text>
<text x="1167.5" y="290" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">tests • build</text>
<text x="1167.5" y="317" text-anchor="middle" fill="#b8c4d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">flash • inspect</text>
